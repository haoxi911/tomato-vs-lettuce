# Serves the storybook on http://<host>:8088
#   cd deploy && docker compose up -d
services:
  storybook:
    image: caddy:2-alpine
    container_name: tomato-storybook
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../:/srv:ro
